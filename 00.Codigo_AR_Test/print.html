<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print target · Chelas y código</title>
  <style>
    body { margin: 0; padding: 24px; background: #eee; font-family: system-ui, sans-serif; text-align: center; }
    img { display: block; width: min(100%, 540px); height: auto; margin: 24px auto; }
    button, a { font: inherit; margin: 8px; }
    @page { size: A4 portrait; margin: 15mm; }
    @media print {
      body { padding: 0; background: #fff; }
      .instructions { display: none; }
      img { width: 180mm; max-width: 100%; margin: 0 auto; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="instructions">
    <p>Este es el primer frame de la animación. Imprime la imagen completa, sin recortarla ni deformarla.</p>
    <button type="button" onclick="window.print()">Imprimir</button>
    <a href="assets/print-target.png" download>Descargar PNG</a>
    <a href="index.html">Abrir cámara AR</a>
  </div>
  <img src="assets/print-target.png" width="1080" height="1440" alt="Primer frame de la retícula tipográfica que activa la animación AR">
</body>
</html>
