<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../">
  <title>Regenerar el target MindAR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
  <style>body { font-family: system-ui, sans-serif; } canvas { width: 270px !important; height: 360px !important; } a { display: block; margin: 16px 0; }</style>
</head>
<body>
  <p id="progress">Cargando…</p>
  <button id="compile" disabled>Generar print y target</button>
  <div id="downloads"></div>
  <div id="preview"></div>
  <script src="sketch.js"></script>
  <script type="module">
    import { Compiler } from 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';

    const tipografia = await window.tipografiaLista;
    const button = document.querySelector('#compile');
    const progress = document.querySelector('#progress');
    progress.textContent = 'El print se genera a partir del frame en tiempo 0.';
    button.disabled = false;

    window.compilarTarget = async () => {
      button.disabled = true;
      tipografia.pausar();
      const png = tipografia.canvas.toDataURL('image/png');
      const imagen = new Image();
      imagen.src = png;
      await imagen.decode();
      const compiler = new Compiler();
      const data = await compiler.compileImageTargets([imagen], (value) => {
        progress.textContent = `Compilando: ${Math.round(value)} %`;
      });
      const buffer = compiler.exportData();
      const mind = URL.createObjectURL(new Blob([buffer], { type: 'application/octet-stream' }));
      const downloads = document.querySelector('#downloads');
      downloads.replaceChildren();
      for (const [filename, url] of [['print-target.png', png], ['print-target.mind', mind]]) {
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.textContent = `Descargar ${filename}`;
        downloads.append(link);
      }
      progress.textContent = 'Listo. Guarda los dos archivos en assets/ y reemplaza las versiones anteriores.';
      button.disabled = false;
      return { png, mind: Array.from(buffer), features: data[0].matchingData.map((frame) => ({
        width: frame.width,
        height: frame.height,
        maxima: frame.maximaPoints.length,
        minima: frame.minimaPoints.length,
      })) };
    };
    button.addEventListener('click', () => window.compilarTarget().catch((error) => {
      progress.textContent = `No se pudo compilar: ${error.message}`;
      button.disabled = false;
    }));
  </script>
</body>
</html>
