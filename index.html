<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Chelas y código · Print AR</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.147.0/examples/jsm/",
        "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
      }
    }
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.11/p5.min.js"></script>
</head>
<body>
  <main>
    <div id="preview" aria-label="Vista previa de la animación tipográfica"></div>
    <div id="ar-container" aria-label="Cámara de realidad aumentada" hidden></div>
    <div id="scan-guide" aria-hidden="true" hidden></div>
  </main>
  <div class="controls">
    <p id="status" role="status" aria-live="polite">Cargando la tipografía…</p>
    <div class="actions">
      <button id="start-ar" type="button" disabled>Activar cámara</button>
      <button id="stop-ar" type="button" hidden>Volver a la animación</button>
      <a href="print.html" target="_blank" rel="noopener">Imprimir target</a>
      <a href="assets/print-target.png" download="print-target.png">Descargar print</a>
    </div>
  </div>
  <script src="sketch.js"></script>
  <script type="module" src="ar.js"></script>
</body>
</html>
